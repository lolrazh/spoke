name: Release

# Build, sign, notarize, and publish a draft GitHub Release on a version tag.
# Tag a release with:  npm version patch && git push --follow-tags
# (or push any tag matching v*). The published release is a DRAFT — review
# and click "Publish release" to make it live (update.electronjs.org then
# serves it to clients).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write # create/upload GitHub Releases

jobs:
  release:
    # Apple Silicon runner — required because the MLX STT sidecar is arm64-only.
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build MLX STT sidecar
        run: |
          set -euo pipefail
          cd local-stt
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          deactivate
          cd ..
          bash local-stt/build-sidecar-onedir.sh
          test -x local-stt/dist-ondir/spoke-stt/spoke-stt

      # Match the npm that generated package-lock.json so `npm ci`'s strict
      # tree derivation agrees with the lockfile (Node's bundled npm differs).
      - name: Pin npm
        run: npm install -g npm@11.4.2

      - name: Install dependencies
        run: npm ci

      - name: Import Developer ID signing certificate
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"

          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PW" "$KEYCHAIN_PATH" >/dev/null
          # Make the temp keychain searchable so codesign/notarytool find the identity
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

      - name: Build, sign, notarize & publish
        env:
          # Signing + notarization (read by forge.config.ts)
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARIZE: "1"
          # GitHub Releases publisher auth
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish
