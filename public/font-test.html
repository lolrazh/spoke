<!DOCTYPE html>
<html>
<head>
    <title>Font Loading Test</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:wght@400&family=Lexend+Deca:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 40px;
            background: #0f0f0f;
            color: white;
        }
        .dm-serif {
            font-family: "DM Serif Display", Georgia, "Times New Roman", serif;
            font-weight: 400;
            line-height: 1.3;
            letter-spacing: -0.025em;
        }
        .lexend {
            font-family: "Lexend Deca", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .large { font-size: 3rem; }
        .medium { font-size: 1.5rem; }
    </style>
</head>
<body>
    <h1 class="dm-serif large">Welcome to Sonic Flow</h1>
    <h2 class="dm-serif medium">Enable Required Permissions</h2>
    <p class="lexend">This is Lexend Deca body text for comparison.</p>
    <p class="lexend">The app should now render fonts cleanly like the website.</p>
</body>
</html>
