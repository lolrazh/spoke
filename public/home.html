<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Sonic Flow Home</title>
    <!-- Import Lexend Deca font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend+Deca&display=swap" rel="stylesheet">

    <style>
      :root {
        --primary-color: #0E0D0C;
        --secondary-color: #FF843E;
        --text-color: #FAFAFA; /* Light text for dark background */
        --tile-stroke-width: 1px;
        --tile-shadow: 0 4px 10px rgba(0,0,0,0.2);
      }

      body {
        font-family: 'Lexend Deca', sans-serif;
        margin: 0;
        padding: 25px;
        background-color: var(--primary-color);
        color: var(--text-color);
        box-sizing: border-box;
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden; /* Prevent body scroll */
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
      }

      .header h1 {
        display: flex;
        align-items: center;
        gap: 10px; /* Space between icon and text */
        color: var(--text-color);
        margin: 0;
        font-size: 1.6em;
      }

      .header-icon {
        width: 24px; /* Adjust size as needed */
        height: 24px;
        fill: var(--secondary-color); /* Color the icon */
      }

      .avatar-placeholder {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background-color: var(--secondary-color); /* Use secondary color for placeholder */
        border: 1px solid var(--text-color);
      }

      .bento-grid {
        flex-grow: 1; /* Take remaining vertical space */
        display: grid;
        grid-template-columns: repeat(3, 1fr); /* Three equal columns */
        grid-template-rows: repeat(2, 1fr);    /* Two equal rows */
        gap: 20px;
        margin-bottom: 20px;
      }

      .tile {
        background-color: var(--primary-color);
        padding: 20px;
        border-radius: 12px;
        box-shadow: var(--tile-shadow);
        border: var(--tile-stroke-width) solid var(--secondary-color);
        display: flex;
        flex-direction: column;
        overflow: hidden; /* Prevent content overflow */
      }

      /* Style tiles spanning two rows */
      .tile.span-2 {
        grid-row: span 2;
      }

      .tile h2 {
        margin-top: 0;
        margin-bottom: 10px;
        font-size: 1.1em;
        color: var(--text-color);
        border-bottom: 1px solid rgba(255, 132, 62, 0.3); /* Faint separator */
        padding-bottom: 8px;
      }

      .tile p {
        font-size: 0.9em;
        opacity: 0.8;
        flex-grow: 1; /* Allow paragraphs to fill space if needed */
      }

      .footer {
        text-align: center;
        font-size: 0.85em;
        padding-top: 15px;
        border-top: 1px solid rgba(255, 132, 62, 0.3); /* Use secondary color, slightly transparent */
      }

      .footer a {
        color: var(--text-color);
        text-decoration: none;
        opacity: 0.7;
        transition: opacity 0.2s;
      }
      .footer a:hover {
        opacity: 1;
        text-decoration: underline;
      }

      #root {
        display: contents;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="header">
        <h1>
          <!-- Placeholder SVG Icon -->
          <svg class="header-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z" fill="currentColor"/></svg>
          Sonic Flow
        </h1>
        <div class="avatar-placeholder"></div>
      </div>

      <div class="bento-grid">
        <div class="tile span-2" style="grid-column: 1;"> <!-- Usage Tile -->
          <h2>Usage</h2>
          <p>Minutes used today...</p>
          <!-- Content -->
        </div>
        <div class="tile span-2" style="grid-column: 2;"> <!-- Plan & Billing Tile -->
          <h2>Plan & Billing</h2>
          <p>Current plan status...</p>
          <!-- Content -->
        </div>
        <div class="tile" style="grid-column: 3; grid-row: 1;"> <!-- Settings Tile -->
          <h2>Settings</h2>
          <p>App preferences...</p>
          <!-- Content -->
        </div>
        <div class="tile" style="grid-column: 3; grid-row: 2;"> <!-- Account Tile -->
          <h2>Account</h2>
          <p>Your profile...</p>
          <!-- Content -->
        </div>
      </div>

      <div class="footer">
        <a href="#" id="support-link">Support</a> | <a href="#" id="about-link">About</a>
      </div>
    </div>

    <!-- React mount script will go here -->
    <!-- <script type="module" src="/src/homeRenderer.tsx"></script> -->
  </body>
</html>
